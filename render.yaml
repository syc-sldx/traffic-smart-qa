services:
  - type: web
    name: traffic-smart-qa
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev && npm run build && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: DATABASE_PATH
        value: ./data/traffic.db
      - key: TRUST_PROXY_HOPS
        value: "0"
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODEL
        value: deepseek-flash
      - key: LLM_API_KEY
        sync: false
      - key: AMAP_API_KEY
        sync: false
